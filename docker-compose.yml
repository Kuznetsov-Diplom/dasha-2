version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dasha_user
      POSTGRES_PASSWORD: dasha_secure_pass_2026
      POSTGRES_DB: dasha_npbk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dasha_user -d dasha_npbk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # app отключен для тестов — запускай локально: python app.py
  # app:
  #   build: .
  #   restart: always
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     - DATABASE_URL=postgresql://dasha_user:dasha_secure_pass_2026@db:5432/dasha_npbk
  #     - GRADIO_SERVER_NAME=0.0.0.0
  #   ports:
  #     - "7860:7860"

  # pgAdmin — умная админка PostgreSQL (port 5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
